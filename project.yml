# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen
name: AmperoEditor
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AmperoKit:
    path: AmperoKit

targets:
  AmperoEditor:
    type: application
    platform: iOS
    sources:
      - AmperoEditor
    dependencies:
      - package: AmperoKit
    info:
      path: AmperoEditor/Info.plist
      properties:
        CFBundleDisplayName: Ampero Editor
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.amperoeditor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""

schemes:
  AmperoEditor:
    build:
      targets:
        AmperoEditor: all
# AmperoKit tests run with `swift test --package-path AmperoKit` (see the CI workflow).
